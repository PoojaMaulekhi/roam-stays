name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Limit Next.js build workers
        run: echo "NEXT_PRIVATE_BUILD_WORKER=1" >> $GITHUB_ENV
      - name: Exclude server-only routes from static export
        run: |
          mkdir -p /tmp/roam-export-excluded
          mv src/app/api /tmp/roam-export-excluded/api
          mv src/app/admin /tmp/roam-export-excluded/admin
          mv src/app/my-bookings /tmp/roam-export-excluded/my-bookings
          mv src/proxy.ts /tmp/roam-export-excluded/proxy.ts
      - run: npm run build
      - name: Redirect missing Pages routes
        run: |
          cat > out/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0;url=/roam-stays/#stays">
              <script>window.location.replace("/roam-stays/#stays");</script>
              <title>Redirecting</title>
            </head>
            <body>Redirecting...</body>
          </html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
